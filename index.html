<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DeepSeek AI Chat</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #1a1a1a;
      color: #ececec;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      padding: 12px 20px;
      background-color: #2d2d2d;
      border-bottom: 1px solid #3d3d3d;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .key-bar {
      display: flex;
      gap: 8px;
    }
    .key-bar input {
      background-color: #1a1a1a;
      border: 1px solid #444;
      color: #fff;
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.85rem;
      width: 220px;
    }
    #chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .message {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 12px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .user { align-self: flex-end; background-color: #0078d4; color: #fff; }
    .assistant { align-self: flex-start; background-color: #2d2d2d; border: 1px solid #3d3d3d; }
    .system-error { align-self: center; background-color: #5a1d1d; color: #ff8888; font-size: 0.9rem; }
    #input-container {
      padding: 15px;
      background-color: #2d2d2d;
      border-top: 1px solid #3d3d3d;
      display: flex;
      gap: 10px;
    }
    textarea {
      flex: 1;
      background-color: #1a1a1a;
      border: 1px solid #3d3d3d;
      border-radius: 8px;
      color: #fff;
      padding: 10px;
      font-size: 1rem;
      resize: none;
      outline: none;
      height: 48px;
    }
    button {
      background-color: #0078d4;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 0 20px;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { background-color: #444; cursor: not-allowed; }
  </style>
</head>
<body>

  <header>
    <span>DeepSeek R1 Chat</span>
    <div class="key-bar">
      <input type="password" id="api-key-input" placeholder="Вставьте OpenRouter API Key">
      <button onclick="saveKey()" style="padding: 0 10px; font-size: 0.8rem;">Сохранить</button>
    </div>
  </header>

  <div id="chat-box"></div>

  <div id="input-container">
    <textarea id="user-input" placeholder="Напишите сообщение..." rows="1"></textarea>
    <button id="send-btn" onclick="sendMessage()">Отправить</button>
  </div>

  <script>
    const chatBox = document.getElementById('chat-box');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');
    const apiKeyInput = document.getElementById('api-key-input');

    // Загружаем сохраненный ключ
    let apiKey = localStorage.getItem('openrouter_key') || '';
    if (apiKey) apiKeyInput.value = apiKey;

    function saveKey() {
      apiKey = apiKeyInput.value.trim();
      localStorage.setItem('openrouter_key', apiKey);
      alert('Ключ сохранен в вашем браузере!');
    }

    const messagesHistory = [];

    userInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    function appendMessage(role, text) {
      const msgDiv = document.createElement('div');
      msgDiv.classList.add('message', role);
      msgDiv.textContent = text;
      chatBox.appendChild(msgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
      return msgDiv;
    }

    async function sendMessage() {
      if (!apiKey) {
        alert('Пожалуйста, введите ваш API ключ OpenRouter вверху справа!');
        return;
      }

      const text = userInput.value.trim();if (!text) return;

      appendMessage('user', text);
      messagesHistory.push({ role: "user", content: text });
      userInput.value = '';
      
      sendBtn.disabled = true;
      userInput.disabled = true;

      const assistantMsgDiv = appendMessage('assistant', 'Думаю...');

      try {
        const response = await fetch('https://openrouter.ai/api/v1/chat/completions', {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${apiKey}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            model: 'deepseek/deepseek-r1:free',
            messages: messagesHistory
          })
        });

        if (!response.ok) throw new Error(`HTTP ${response.status}`);

        const data = await response.json();
        const reply = data.choices[0].message.content;
        
        assistantMsgDiv.textContent = reply;
        messagesHistory.push({ role: "assistant", content: reply });

      } catch (err) {
        assistantMsgDiv.classList.remove('assistant');
        assistantMsgDiv.classList.add('system-error');
        assistantMsgDiv.textContent = `Ошибка: (${err.message}). Проверьте ключ.`;
      } finally {
        sendBtn.disabled = false;
        userInput.disabled = false;
        userInput.focus();
      }
    }
  </script>
</body>
</html>
