<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Free AI Chat</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #1a1a1a;
      color: #ececec;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      padding: 15px 20px;
      background-color: #2d2d2d;
      border-bottom: 1px solid #3d3d3d;
      font-weight: bold;
      font-size: 1.1rem;
      text-align: center;
    }
    #chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .message {
      max-width: 80%;
      padding: 12px 16px;
      border-radius: 12px;
      line-height: 1.5;
      white-space: pre-wrap;
      word-wrap: break-word;
    }
    .user {
      align-self: flex-end;
      background-color: #0078d4;
      color: #fff;
    }
    .assistant {
      align-self: flex-start;
      background-color: #2d2d2d;
      border: 1px solid #3d3d3d;
      color: #ececec;
    }
    .system-error {
      align-self: center;
      background-color: #5a1d1d;
      color: #ff8888;
      font-size: 0.9rem;
    }
    #input-container {
      padding: 15px;
      background-color: #2d2d2d;
      border-top: 1px solid #3d3d3d;
      display: flex;
      gap: 10px;
    }
    textarea {
      flex: 1;
      background-color: #1a1a1a;
      border: 1px solid #3d3d3d;
      border-radius: 8px;
      color: #fff;
      padding: 10px;
      font-size: 1rem;
      resize: none;
      outline: none;
      height: 48px;
    }
    textarea:focus { border-color: #0078d4; }
    button {
      background-color: #0078d4;
      color: #fff;
      border: none;
      border-radius: 8px;
      padding: 0 20px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background-color: #005a9e; }
    button:disabled { background-color: #444; cursor: not-allowed; }
  </style>
</head>
<body>

  <header>Free AI Chat</header>

  <div id="chat-box"></div>

  <div id="input-container">
    <textarea id="user-input" placeholder="Напишите сообщение..." rows="1"></textarea>
    <button id="send-btn" onclick="sendMessage()">Отправить</button>
  </div>

  <script>
    const chatBox = document.getElementById('chat-box');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');

    userInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });

    function appendMessage(role, text) {
      const msgDiv = document.createElement('div');
      msgDiv.classList.add('message', role);
      msgDiv.textContent = text;
      chatBox.appendChild(msgDiv);
      chatBox.scrollTop = chatBox.scrollHeight;
      return msgDiv;
    }

    async function sendMessage() {
      const text = userInput.value.trim();
      if (!text) return;

      appendMessage('user', text);
      userInput.value = '';
      
      sendBtn.disabled = true;
      userInput.disabled = true;

      const assistantMsgDiv = appendMessage('assistant', 'Думаю...');

      try {
        // Кодируем текст для безопасной передачи в URL
        const encodedPrompt = encodeURIComponent(text);
        
        // Надежный GET-запрос к Pollinations
        const response = await fetch(`https://text.pollinations.ai/${encodedPrompt}?model=mistral`);

        if (!response.ok) {
          throw new Error(`HTTP Error: ${response.status}`);
        }

        const reply = await response.text();
        assistantMsgDiv.textContent = reply;

      } catch (err) {
        assistantMsgDiv.classList.remove('assistant');
        assistantMsgDiv.classList.add('system-error');assistantMsgDiv.textContent = `Ошибка: Не удалось получить ответ (${err.message})`;
      } finally {
        sendBtn.disabled = false;
        userInput.disabled = false;
        userInput.focus();
      }
    }
  </script>
</body>
</html>
